<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="JetBrains Mono, monospace">
  <defs>
    <style>
      .bg{fill:#1A1D21}
      .frame{fill:none;stroke:rgba(232,168,56,0.25);stroke-width:1.5}
      .zone{fill:rgba(232,168,56,0.04);stroke:rgba(232,168,56,0.3);stroke-width:1.2;stroke-dasharray:6 4}
      .cam{fill:#E8A838}
      .fov{fill:none;stroke:rgba(232,168,56,0.45);stroke-width:1}
      .line{stroke:#B8BCC2;stroke-width:1.2;fill:none;opacity:0.7}
      .nvr{fill:#252830;stroke:rgba(232,168,56,0.4);stroke-width:1.5}
      .t1{fill:#F5F6FA;font-size:14px;font-weight:600}
      .t2{fill:#B8BCC2;font-size:10px}
      .lbl{fill:#E8A838;font-size:10px;letter-spacing:1.5px}
      .dim{fill:#6B7280;font-size:10px}
      .num{fill:#0F1215;font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <rect class="frame" x="16" y="16" width="928" height="508" rx="10"/>

  <text class="lbl" x="60" y="46">CCTV SURVEILLANCE · COVERAGE PLAN</text>
  <text class="t1" x="60" y="68" font-size="18">64-Camera IP Platform · 4 Zones</text>

  <!-- Site outline -->
  <rect class="zone" x="60" y="90" width="840" height="360" rx="10"/>

  <!-- Zone A: Perimeter -->
  <g>
    <rect class="zone" x="80" y="110" width="380" height="150"/>
    <text class="lbl" x="92" y="132">ZONE A · PERIMETER · 16× BULLET 4K</text>
    <!-- cameras with FOV cones -->
    <circle class="cam" cx="120" cy="150" r="5"/><path class="fov" d="M120 150 L160 130 M120 150 L165 165"/>
    <circle class="cam" cx="300" cy="145" r="5"/><path class="fov" d="M300 145 L340 125 M300 145 L345 160"/>
    <circle class="cam" cx="430" cy="235" r="5"/><path class="fov" d="M430 235 L390 215 M430 235 L385 250"/>
    <text class="t2" x="92" y="240">Gate · ANPR lane · Fence line 1</text>
  </g>

  <!-- Zone B: Warehouse -->
  <g>
    <rect class="zone" x="500" y="110" width="380" height="150"/>
    <text class="lbl" x="512" y="132">ZONE B · WAREHOUSE · 20× TURRET 4MP</text>
    <circle class="cam" cx="540" cy="160" r="5"/><path class="fov" d="M540 160 L580 145 M540 160 L585 175"/>
    <circle class="cam" cx="700" cy="165" r="5"/><path class="fov" d="M700 165 L740 150 M700 165 L745 180"/>
    <circle class="cam" cx="840" cy="230" r="5"/><path class="fov" d="M840 230 L800 210 M840 230 L795 245"/>
    <text class="t2" x="512" y="240">Racking aisles · Loading dock 1-2</text>
  </g>

  <!-- Zone C: Production floor -->
  <g>
    <rect class="zone" x="80" y="280" width="380" height="150"/>
    <text class="lbl" x="92" y="302">ZONE C · PRODUCTION · 18× DOME 4MP</text>
    <circle class="cam" cx="130" cy="330" r="5"/><path class="fov" d="M130 330 L170 315 M130 330 L175 345"/>
    <circle class="cam" cx="290" cy="340" r="5"/><path class="fov" d="M290 340 L330 325 M290 340 L335 355"/>
    <circle class="cam" cx="420" cy="400" r="5"/><path class="fov" d="M420 400 L380 380 M420 400 L375 415"/>
    <text class="t2" x="92" y="410">Assembly lines 1-3 · QC bench</text>
  </g>

  <!-- Zone D: Offices -->
  <g>
    <rect class="zone" x="500" y="280" width="380" height="150"/>
    <text class="lbl" x="512" y="302">ZONE D · OFFICES · 10× DOME 4MP</text>
    <circle class="cam" cx="540" cy="335" r="5"/><path class="fov" d="M540 335 L580 320 M540 335 L585 350"/>
    <circle class="cam" cx="700" cy="345" r="5"/><path class="fov" d="M700 345 L740 330 M700 345 L745 360"/>
    <text class="t2" x="512" y="410">Entrances · Corridors · Server room door</text>
  </g>

  <!-- Trunk lines to NVR room -->
  <path class="line" d="M270 260 V 300" stroke-dasharray="4 4"/>
  <path class="line" d="M690 260 V 300" stroke-dasharray="4 4"/>

  <!-- NVR / core -->
  <g>
    <rect class="nvr" x="330" y="470" width="300" height="0"/>
    <rect class="nvr" x="330" y="458" width="300" height="40" rx="8"/>
    <text class="lbl" x="342" y="474">NVR ROOM · RACK R1</text>
    <text class="t2" x="342" y="490">2× NVR 32CH · RAID6 96TB · UPS 3kVA</text>
  </g>
  <path class="line" d="M270 430 C 270 450 320 470 345 472"/>
  <path class="line" d="M690 430 C 690 450 640 470 615 472"/>

  <!-- PoE note -->
  <text class="dim" x="60" y="508">ALL DROPS: CAT6 · POE+ (802.3AT) · 90M MAX · VLANS: CCTV / CORP ISOLATED</text>
</svg>
