<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="JetBrains Mono, monospace">
  <defs>
    <style>
      .bg{fill:#1A1D21}
      .frame{fill:none;stroke:rgba(232,168,56,0.25);stroke-width:1.5}
      .bld{fill:#252830;stroke:rgba(232,168,56,0.4);stroke-width:1.5}
      .fib{stroke:#E8A838;stroke-width:2.5;fill:none}
      .fib-dim{stroke:rgba(232,168,56,0.4);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
      .t1{fill:#F5F6FA;font-size:14px;font-weight:600}
      .t2{fill:#B8BCC2;font-size:10px}
      .lbl{fill:#E8A838;font-size:10px;letter-spacing:1.5px}
      .dim{fill:#6B7280;font-size:10px}
      .odf{fill:#0F1215;stroke:rgba(232,168,56,0.5);stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <rect class="frame" x="16" y="16" width="928" height="508" rx="10"/>

  <text class="lbl" x="60" y="46">FIBER BACKBONE · INTER-BUILDING LINK MAP</text>
  <text class="t1" x="60" y="68" font-size="18">Campus Ring · 6 Buildings</text>

  <!-- Core node: Main DF -->
  <g>
    <rect class="bld" x="80" y="220" width="170" height="110" rx="8"/>
    <text class="lbl" x="92" y="244">B1 · MAIN DF</text>
    <text class="t1" x="92" y="268">Core POP</text>
    <text class="t2" x="92" y="288">48F ODF · DWDM ready</text>
    <text class="t2" x="92" y="304">OTDR + light source</text>
  </g>

  <!-- Ring links (solid = new build) -->
  <path class="fib" d="M250 240 C 340 200 400 170 470 150"/>
  <path class="fib" d="M250 310 C 340 350 400 380 470 400"/>
  <path class="fib-dim" d="M640 140 C 700 130 760 140 820 170"/>
  <path class="fib-dim" d="M640 410 C 700 420 760 410 820 380"/>

  <!-- B2 -->
  <g>
    <rect class="bld" x="470" y="100" width="170" height="90" rx="8"/>
    <text class="lbl" x="482" y="124">B2 · ENGINEERING</text>
    <text class="t2" x="482" y="146">12F ODF · 2 links in ring</text>
    <text class="t2" x="482" y="162">620 m · −18.4 dB</text>
  </g>
  <!-- B6 -->
  <g>
    <rect class="bld" x="470" y="360" width="170" height="90" rx="8"/>
    <text class="lbl" x="482" y="384">B6 · WAREHOUSE</text>
    <text class="t2" x="482" y="406">12F ODF · 2 links in ring</text>
    <text class="t2" x="482" y="422">810 m · −21.7 dB</text>
  </g>
  <!-- B3 -->
  <g>
    <rect class="bld" x="820" y="120" width="110" height="90" rx="8"/>
    <text class="lbl" x="830" y="144">B3 · LAB</text>
    <text class="t2" x="830" y="164">6F ODF</text>
    <text class="t2" x="830" y="180">430 m</text>
  </g>
  <!-- B5 -->
  <g>
    <rect class="bld" x="820" y="330" width="110" height="90" rx="8"/>
    <text class="lbl" x="830" y="354">B5 · OFFICE</text>
    <text class="t2" x="830" y="374">6F ODF</text>
    <text class="t2" x="830" y="390">390 m</text>
  </g>

  <!-- Ring closure between B3 and B5 -->
  <path class="fib-dim" d="M875 210 V 330"/>
  <text class="dim" x="885" y="275" transform="rotate(-90 885 275)">ring closure</text>

  <!-- Duct cross-section note -->
  <g>
    <rect class="odf" x="80" y="430" width="360" height="70" rx="8"/>
    <text class="lbl" x="92" y="452">DUCT CROSS-SECTION (TYPICAL)</text>
    <text class="t2" x="92" y="472">Ø110 HDPE · inner sub-duct ×4 · 2× 24F OM4 + 2× spare</text>
    <text class="t2" x="92" y="488">Depth 90 cm · warning tape · pull boxes every 60 m</text>
  </g>

  <!-- Test results -->
  <g>
    <rect class="odf" x="560" y="430" width="320" height="70" rx="8"/>
    <text class="lbl" x="572" y="452">ACCEPTANCE (OTDR @ 1310/1550)</text>
    <text class="t2" x="572" y="472">All links &lt; 0.35 dB/km · splices ≤ 0.05 dB</text>
    <text class="t2" x="572" y="488">Bi-directional traces archived · PDF per link</text>
  </g>

  <!-- Legend -->
  <line class="fib" x1="80" y1="96" x2="120" y2="96"/>
  <text class="t2" x="128" y="100">New build (this project)</text>
  <line class="fib-dim" x1="300" y1="96" x2="340" y2="96"/>
  <text class="t2" x="348" y="100">Existing / ring closure</text>
</svg>
