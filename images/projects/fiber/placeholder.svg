<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d21"/><stop offset="1" stop-color="#0f1215"/>
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(232,168,56,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9A7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0070F3" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg4)"/>
  <rect width="1200" height="700" fill="url(#grid4)"/>
  <!-- fusion splicer -->
  <g transform="translate(280 160)" opacity="0.95">
    <rect x="0" y="0" width="300" height="200" rx="14" fill="#252830" stroke="rgba(232,168,56,0.4)" stroke-width="2"/>
    <rect x="20" y="20" width="260" height="100" rx="8" fill="#0f1215" stroke="rgba(232,168,56,0.3)"/>
    <!-- arc view -->
    <path d="M60 90 Q150 40 240 90" fill="none" stroke="#00D9A7" stroke-width="3"/>
    <circle cx="150" cy="62" r="6" fill="#7CFCFF">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="20" y="132" width="120" height="50" rx="8" fill="#1a1d21" stroke="rgba(232,168,56,0.3)"/>
    <text x="80" y="162" text-anchor="middle" font-family="monospace" font-size="14" fill="#E8A838">0.02 dB</text>
    <g fill="#00B894"><circle cx="180" cy="150" r="6"/><circle cx="205" cy="150" r="6"/><circle cx="230" cy="150" r="6"/></g>
    <rect x="255" y="142" width="26" height="18" rx="4" fill="rgba(232,168,56,0.3)"/>
  </g>
  <!-- ODF panel -->
  <g transform="translate(680 140)" opacity="0.95">
    <rect x="0" y="0" width="260" height="320" rx="12" fill="#252830" stroke="rgba(232,168,56,0.4)" stroke-width="2"/>
    <rect x="16" y="16" width="228" height="40" rx="6" fill="#1a1d21" stroke="rgba(232,168,56,0.3)"/>
    <text x="130" y="41" text-anchor="middle" font-family="monospace" font-size="15" fill="#E8A838">ODF — 48 CORES</text>
    <g>
      <g fill="none" stroke-width="2">
        <path d="M30 90q60 -18 120 0t90 0" stroke="#00D9A7" opacity="0.8"/>
        <path d="M30 120q60 18 120 0t90 0" stroke="#0070F3" opacity="0.8"/>
        <path d="M30 150q60 -18 120 0t90 0" stroke="#00D9A7" opacity="0.6"/>
        <path d="M30 180q60 18 120 0t90 0" stroke="#7CFCFF" opacity="0.7"/>
        <path d="M30 210q60 -18 120 0t90 0" stroke="#00D9A7" opacity="0.5"/>
        <path d="M30 240q60 18 120 0t90 0" stroke="#0070F3" opacity="0.6"/>
        <path d="M30 270q60 -18 120 0t90 0" stroke="#7CFCFF" opacity="0.5"/>
      </g>
      <g fill="#E8A838">
        <circle cx="30" cy="90" r="4"/><circle cx="30" cy="120" r="4"/><circle cx="30" cy="150" r="4"/>
        <circle cx="30" cy="180" r="4"/><circle cx="30" cy="210" r="4"/><circle cx="30" cy="240" r="4"/><circle cx="30" cy="270" r="4"/>
        <circle cx="240" cy="90" r="4"/><circle cx="240" cy="120" r="4"/><circle cx="240" cy="150" r="4"/>
        <circle cx="240" cy="180" r="4"/><circle cx="240" cy="210" r="4"/><circle cx="240" cy="240" r="4"/><circle cx="240" cy="270" r="4"/>
      </g>
    </g>
  </g>
  <!-- fiber light beam across floor -->
  <path d="M0 620 L1200 560" stroke="url(#beam)" stroke-width="4" fill="none" opacity="0.6"/>
  <g fill="#00D9A7">
    <circle cx="300" cy="608" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="590" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="572" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="668" text-anchor="middle" font-family="monospace" font-size="20" fill="rgba(232,168,56,0.7)" letter-spacing="4">FIBER OPTIC — PHOTO COMING SOON</text>
</svg>
